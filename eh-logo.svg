<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1b2436"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <linearGradient id="mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="200" fill="url(#grid)"/>

  <!-- subtle orbit ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#5eead4" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- code bracket accents -->
  <text x="60" y="230" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="42" fill="#5eead4" fill-opacity="0.35">&lt;</text>
  <text x="300" y="230" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="42" fill="#818cf8" fill-opacity="0.35">/&gt;</text>

  <!-- monogram -->
  <text x="200" y="240" font-family="'Georgia', 'Times New Roman', serif" font-size="150" font-weight="700"
        text-anchor="middle" fill="url(#mono)">EH</text>

  <!-- baseline -->
  <line x1="120" y1="272" x2="280" y2="272" stroke="url(#mono)" stroke-width="3" stroke-linecap="round"/>
</svg>
