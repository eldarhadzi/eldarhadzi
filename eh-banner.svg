<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#131a2a"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.05" stroke-width="6"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="300" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#panel)"/>

    <!-- faint code lines in background, right side -->
    <g font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#5eead4" fill-opacity="0.10">
      <text x="740" y="40">const engineer = new BusinessTechnologist();</text>
      <text x="740" y="62">engineer.stack = ['React','Flutter','PostgreSQL'];</text>
      <text x="740" y="84">engineer.negotiates(true);</text>
      <text x="740" y="106">export default engineer;</text>
    </g>

    <!-- diagonal hatch accent block -->
    <polygon points="1000,0 1200,0 1200,300 1080,300" fill="url(#hatch)"/>
    <polygon points="1000,0 1080,0 940,300 860,300" fill="#5eead4" fill-opacity="0.06"/>

    <!-- left accent bar -->
    <rect x="0" y="0" width="6" height="300" fill="url(#accentText)"/>

    <!-- name -->
    <text x="60" y="140" font-family="'Georgia','Times New Roman',serif" font-size="56" font-weight="700" fill="#f5f7fa">
      Eldar Hadžović
    </text>

    <!-- underline -->
    <rect x="62" y="158" width="360" height="3" fill="url(#accentText)"/>

    <!-- title -->
    <text x="60" y="198" font-family="'Helvetica Neue',Arial,sans-serif" font-size="26" fill="#a9b4c6">
      Business Technologist · Full-Stack &amp; Mobile Developer
    </text>

    <!-- tagline -->
    <text x="60" y="232" font-family="'JetBrains Mono','Courier New',monospace" font-size="16" fill="#5eead4" fill-opacity="0.8">
      Coding. Connecting. Conquering deals.
    </text>

    <!-- location / links row -->
    <text x="60" y="266" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6b7688">
      Sarajevo · Ankara &#8226; github.com/eldarhadzi &#8226; linkedin.com/in/eldar-hadžović
    </text>
  </g>
</svg>
